/* ---- Proposed-ops panel (per-turn, inside the assistant bubble) ---- */

// Build an HTML details block showing exactly what this op will do once applied.
// For create_card this surfaces description, checklist, assignee, due, labels —
// otherwise the user only sees the title in the row and assumes that's all.
function renderOpDetails(op) {
  const parts = [];
  const field = (label, val) =>
    `<div class="od-field"><span class="od-label">${label}</span> ${val}</div>`;

  if (op.op === 'create_card') {
    if (op.assignee) parts.push(field('Assignee', escHtml(op.assignee)));
    if (op.due)      parts.push(field('Due', escHtml(op.due)));
    if (Array.isArray(op.labels) && op.labels.length)
      parts.push(field('Labels', op.labels.map(l => escHtml(l)).join(', ')));
    if (op.description)
      parts.push(field('Description', `<pre>${escHtml(op.description)}</pre>`));
    if (Array.isArray(op.checklist) && op.checklist.length) {
      // Per-item checkboxes so the user can drop individual subtasks before
      // applying. Note: the row uses a <label> wrapper for the main op
      // checkbox, so we can't nest another <label> here (invalid HTML +
      // Chrome routes the inner click to the outer input). Use spans and
      // wire the toggle manually via stopPropagation in the apply path.
      const items = op.checklist.map((it, k) => `
        <li>
          <input type="checkbox" data-keep-i="${k}" checked
            onclick="event.stopPropagation();"
            style="margin-right:6px;vertical-align:middle;" />
          <span>${escHtml(it)}</span>
        </li>
      `).join('');
      parts.push(field('Checklist', `<ul class="od-checklist">${items}</ul>`));
    }
  } else if (op.op === 'add_comment') {
    if (op.text) parts.push(field('Text', `<pre>${escHtml(op.text)}</pre>`));
  } else if (op.op === 'tick_checklist' || op.op === 'add_checklist_item') {
    if (op.item) parts.push(field('Item', escHtml(op.item)));
  } else if (op.op === 'move_card') {
    if (op.target_list) parts.push(field('Target list', escHtml(op.target_list)));
  } else if (op.op === 'update_field') {
    if (op.field) parts.push(field('Field', escHtml(op.field)));
    if (op.value !== undefined) parts.push(field('New value', escHtml(JSON.stringify(op.value))));
  }
  if (!parts.length) return '';
  return `<div class="op-details">${parts.join('')}</div>`;
}

// One row + its details block. Shared by chat sidebar and notes wizard.
function renderOpRowHtml(op, i) {
  const checked = op.confidence !== 'low' ? 'checked' : '';
  const target = op.card
    ? `${op.board || ''} / ${op.list || ''} / ${op.card}`
    : `${op.board || ''} / ${op.list || ''}`;
  const headline = op.op === 'create_card'        ? `"${escHtml(op.title || '')}"`
                 : op.op === 'add_comment'        ? `"${escHtml((op.text || '').slice(0, 80))}${(op.text || '').length > 80 ? '…' : ''}"`
                 : op.op === 'tick_checklist'     ? `tick "${escHtml(op.item || '')}"`
                 : op.op === 'add_checklist_item' ? `add "${escHtml(op.item || '')}"`
                 : op.op === 'move_card'          ? `→ ${escHtml(op.target_list || '')}`
                 : op.op === 'update_field'       ? `${escHtml(op.field || '')} = ${escHtml(JSON.stringify(op.value))}`
                 : '';
  return `
    <label>
      <input type="checkbox" data-i="${i}" ${checked} />
      <strong>${escHtml(op.op || '')}</strong>
      <span class="conf conf-${op.confidence || 'med'}">${escHtml(op.confidence || '')}</span>
      <span class="target">${escHtml(target)}</span>
      <span class="summary">${headline}</span>
      <div class="reason">${escHtml(op.reason || '')}</div>
    </label>
    ${renderOpDetails(op)}`;
}

function renderOpsRows(ops, container) {
  container.innerHTML = '';
  if (!ops.length) {
    container.innerHTML = '<p style="color:#5e6c84;font-size:13px;">No operations proposed.</p>';
    return;
  }
  ops.forEach((op, i) => {
    const div = document.createElement('div');
    div.className = 'op-row';
    div.innerHTML = renderOpRowHtml(op, i);
    container.appendChild(div);
  });
}

// Walk a container of rendered op rows and return only the ones the user kept,
// honoring per-checklist-item checkboxes for create_card. The returned op
// objects are shallow clones — never mutate the input array.
function collectSelectedOps(container, allOps) {
  const rows = container.querySelectorAll('.op-row');
  const out = [];
  rows.forEach(row => {
    const main = row.querySelector('input[type=checkbox][data-i]');
    if (!main || !main.checked) return;
    const idx = parseInt(main.dataset.i, 10);
    const op = allOps[idx];
    if (!op) return;
    if (op.op === 'create_card' && Array.isArray(op.checklist) && op.checklist.length) {
      const keepBoxes = row.querySelectorAll('input[type=checkbox][data-keep-i]');
      const keptItems = [];
      keepBoxes.forEach(b => {
        if (b.checked) keptItems.push(op.checklist[parseInt(b.dataset.keepI, 10)]);
      });
      out.push({ ...op, checklist: keptItems });
    } else {
      out.push(op);
    }
  });
  return out;
}

function renderOpsPanelForTurn(bubble, turnIndex) {
  const ops = chatState.pendingByTurn[turnIndex] || [];
  let panel = bubble.querySelector('.chat-ops-panel');
  if (!panel) {
    panel = document.createElement('div');
    panel.className = 'chat-ops-panel';
    panel.dataset.turnIndex = String(turnIndex);
    panel.innerHTML = `
      <div class="panel-title">Proposed changes (<span class="chat-ops-count">0</span>)</div>
      <div class="chat-ops-rows"></div>
      <div class="refine-form">
        <textarea placeholder="Tell the AI what to change before applying…"></textarea>
        <div class="refine-actions">
          <button class="btn-sm primary refine-send" type="button">Ask AI to revise</button>
        </div>
      </div>
      <div class="actions-row">
        <span class="spacer"></span>
        <button class="chat-ops-apply btn-new-card">Apply</button>
      </div>
    `;
    bubble.querySelector('.chat-ops').appendChild(panel);
    panel.querySelector('.chat-ops-apply').addEventListener('click', () => {
      applyOpsForTurn(bubble, turnIndex);
    });
    const refineTextarea = panel.querySelector('.refine-form textarea');
    panel.querySelector('.refine-send').addEventListener('click', () => {
      const text = refineTextarea.value.trim();
      if (!text) return;
      refineProposalsForTurn(bubble, turnIndex, text);
    });
    refineTextarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const text = refineTextarea.value.trim();
        if (text) refineProposalsForTurn(bubble, turnIndex, text);
      }
    });
  }
  panel.querySelector('.chat-ops-count').textContent = ops.length;
  renderOpsRows(ops, panel.querySelector('.chat-ops-rows'));
}

// Send a refine instruction with the current proposals as context.
// Replaces this turn's pending ops with whatever the model re-emits.
function refineProposalsForTurn(bubble, turnIndex, feedback) {
  const ops = chatState.pendingByTurn[turnIndex] || [];
  const proposalsBlock = ops.length
    ? `(Currently proposed:\n` +
      ops.map((op, i) => `  ${i + 1}. ${describePendingOp(op)}`).join('\n') +
      `)\n\n`
    : '';
  // Wipe the proposals for this turn — the new turn will populate fresh ones.
  chatState.pendingByTurn[turnIndex] = [];
  // Re-render the now-empty panel so old proposals visually disappear.
  renderOpsPanelForTurn(bubble, turnIndex);
  sendChatMessage({
    displayText: feedback,
    outgoingText: proposalsBlock + feedback,
  });
}

function describeAppliedOp(applied) {
  return `${applied.op} ${applied.target}`;
}

// Compact one-line description of a queued op for the refine context block.
function describePendingOp(op) {
  const path = op.card
    ? `${op.board || '?'}/${op.list || '?'}/${op.card}`
    : `${op.board || '?'}/${op.list || '?'}`;
  if (op.op === 'create_card')        return `create_card "${op.title || ''}" → ${path} (assignee=${op.assignee || '–'}, due=${op.due || '–'})`;
  if (op.op === 'add_comment')        return `add_comment on ${path}: "${(op.text || '').slice(0, 100)}"`;
  if (op.op === 'tick_checklist')     return `tick "${op.item || ''}" on ${path}`;
  if (op.op === 'add_checklist_item') return `add_checklist_item "${op.item || ''}" on ${path}`;
  if (op.op === 'move_card')          return `move_card ${path} → ${op.target_list || '?'}`;
  if (op.op === 'update_field')       return `update_field ${op.field || '?'}=${JSON.stringify(op.value)} on ${path}`;
  return `${op.op} on ${path}`;
}

async function applyOpsForTurn(bubble, turnIndex) {
  const panel = bubble.querySelector('.chat-ops-panel');
  if (!panel) return;
  const allOps = chatState.pendingByTurn[turnIndex] || [];
  const selected = collectSelectedOps(panel.querySelector('.chat-ops-rows'), allOps);
  if (!selected.length) return;

  const applyBtn = panel.querySelector('.chat-ops-apply');
  applyBtn.disabled = true;
  applyBtn.innerHTML = '<span class="spinner" style="border-color:#fff5;border-top-color:#fff;"></span> Applying…';

  let result;
  try {
    result = await api.post('/api/notes/apply', {
      note_id: null,
      operations: selected,
    });
  } catch (err) {
    applyBtn.disabled = false;
    applyBtn.textContent = 'Apply';
    appendErrorLine(bubble, 'Apply failed: ' + err.message);
    return;
  }

  const applied = result.applied || [];
  const skipped = result.skipped || [];

  panel.classList.add('applied');
  panel.querySelector('.chat-ops-rows').innerHTML =
    `<div style="font-size:12px;color:#172b4d;">✓ Applied ${applied.length} of ${selected.length}` +
    (skipped.length ? ` — ${skipped.length} skipped` : '') + `</div>` +
    (skipped.length ? `<ul style="font-size:12px;color:#bf2600;margin:4px 0 0 14px;">` +
       skipped.map(s => `<li>${escHtml(s.op && s.op.op || '')}: ${escHtml(s.reason || '')}</li>`).join('') +
       `</ul>` : '');
  applyBtn.remove();

  if (applied.length) {
    const summaries = applied.map(a => describeAppliedOp(a)).join('; ');
    const note = `(Applied: ${summaries})`;
    chatState.pendingApplyNote = chatState.pendingApplyNote
      ? chatState.pendingApplyNote + ' ' + note
      : note;
  }

  delete chatState.pendingByTurn[turnIndex];

  if (typeof refreshCurrentView === 'function') refreshCurrentView();
}

/* ---- Send ---- */

async function sendChatMessage(opts) {
  if (chatState.inflight) return;
  const inputEl = document.getElementById('chat-input');
  // opts.displayText / opts.outgoingText let callers (e.g. refine) send a
  // longer payload to the model than what shows up in the user bubble.
  const text = (opts && opts.displayText !== undefined)
    ? opts.displayText
    : inputEl.value.trim();
  if (!text) return;

  let outgoing = (opts && opts.outgoingText !== undefined) ? opts.outgoingText : text;
  if (chatState.pendingApplyNote) {
    outgoing = chatState.pendingApplyNote.trim() + '\n\n' + outgoing;
    chatState.pendingApplyNote = '';
  }

  chatState.turnCounter += 1;
  const turnIndex = chatState.turnCounter;

  renderUserMessage(text);
  inputEl.value = '';
  chatState.messages.push({ role: 'user', content: outgoing });

  const bubble = renderAssistantBubble();
  bubble.dataset.turnIndex = String(turnIndex);
  chatState.inflight = true;
  document.getElementById('btn-chat-send').disabled = true;

  let lastToolLine = null;

  try {
    const done = await streamChat(chatState.messages, (ev) => {
      switch (ev.type) {
        case 'started':
          setBubbleStatus(bubble, 'Working…');
          break;
        case 'turn':
          setBubbleStatus(bubble, `Turn ${ev.n}…`);
          break;
        case 'tool':
          lastToolLine = appendToolLine(bubble, ev.name, ev.args);
          break;
        case 'result':
          appendToolResultSummary(lastToolLine, ev.summary);
          break;
        case 'queued':
          if (!chatState.pendingByTurn[turnIndex]) chatState.pendingByTurn[turnIndex] = [];
          // Store as a full op (op name + all args), matching the shape
          // /api/notes/apply expects.
          chatState.pendingByTurn[turnIndex].push({ op: ev.op, ...(ev.args || {}) });
          renderOpsPanelForTurn(bubble, turnIndex);
          break;
        case 'text':
          appendAssistantText(bubble, ev.text);
          break;
        case 'done':
          clearBubbleStatus(bubble);
          break;
      }
    });
    if (done && Array.isArray(done.messages_appended)) {
      chatState.messages.push(...done.messages_appended);
    }
  } catch (err) {
    appendErrorLine(bubble, err.message);
  } finally {
    chatState.inflight = false;
    document.getElementById('btn-chat-send').disabled = false;
    inputEl.focus();
  }
}

document.getElementById('btn-chat-send').addEventListener('click', sendChatMessage);
document.getElementById('chat-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChatMessage();
  }
});

function formatNotesEvent(ev) {
  switch (ev.type) {
    case 'started':  return `🟢 Started — note ${ev.note_id}`;
    case 'turn':     return `↻ Turn ${ev.n}`;
    case 'tool': {
      const a = ev.args || {};
      if (ev.name === 'search_cards')  return `🔍 search_cards "${a.query || ''}"`;
      if (ev.name === 'read_card')     return `📄 read_card ${a.board || '?'}/${a.list || '?'}/${a.slug || '?'}`;
      if (ev.name === 'list_boards')   return `📚 list_boards`;
      if (ev.name === 'list_cards')    return `📋 list_cards ${a.board || '?'}${a.list ? '/' + a.list : ''}`;
      if (ev.name === 'create_card')   return `➕ create_card "${a.title || ''}" → ${a.board || '?'}/${a.list || '?'}`;
      if (ev.name === 'add_comment')   return `💬 add_comment on ${a.board || '?'}/${a.card || '?'}`;
      if (ev.name === 'tick_checklist')     return `☑️ tick "${a.item || ''}" on ${a.card || '?'}`;
      if (ev.name === 'add_checklist_item') return `➕ checklist item "${a.item || ''}" on ${a.card || '?'}`;
      if (ev.name === 'move_card')     return `↪️ move ${a.card || '?'} → ${a.target_list || '?'}`;
      if (ev.name === 'update_field')  return `✏️ update ${a.field || '?'} on ${a.card || '?'}`;
      if (ev.name === 'finish')        return `🏁 finish`;
      return `→ ${ev.name}`;
    }
    case 'result':   return `   ${ev.summary || ''}`;
    case 'queued':   return `   queued ${ev.op}`;
    case 'finish':   return `🏁 ${ev.summary || ''}`;
    case 'done':     return `✅ Done — ${(ev.operations || []).length} op(s) proposed`;
    case 'error':    return `❌ ${ev.message || 'error'}`;
    default:         return JSON.stringify(ev);
  }
}

function appendNotesEvent(text) {
  const panel = document.getElementById('notes-events');
  const line = document.createElement('div');
  line.textContent = text;
  panel.appendChild(line);
  panel.scrollTop = panel.scrollHeight;
}

async function streamNotesAnalyze(text, title, onEvent) {
  const r = await fetch('/api/notes/analyze', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
    body: JSON.stringify({ text, title }),
  });
  if (!r.ok) throw new Error(`POST /api/notes/analyze: ${r.status}`);
  const reader = r.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  let lastDone = null;
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    // SSE: events are separated by a blank line; each 'data:' line carries our JSON.
    let idx;
    while ((idx = buf.indexOf('\n\n')) !== -1) {
      const block = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      const dataLines = block.split('\n')
        .filter(l => l.startsWith('data:'))
        .map(l => l.slice(5).trimStart());
      if (!dataLines.length) continue;
      let parsed;
      try { parsed = JSON.parse(dataLines.join('\n')); }
      catch { continue; }
      onEvent(parsed);
      if (parsed.type === 'done') lastDone = parsed;
      if (parsed.type === 'error') throw new Error(parsed.message || 'analyze error');
    }
  }
  if (!lastDone) throw new Error('stream ended without a done event');
  return lastDone;
}

async function streamNotesRefine(noteId, currentOps, feedback, onEvent) {
  const r = await fetch('/api/notes/refine', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
    body: JSON.stringify({ note_id: noteId, current_ops: currentOps, feedback }),
  });
  if (!r.ok) throw new Error(`POST /api/notes/refine: ${r.status}`);
  const reader = r.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  let lastDone = null;
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n\n')) !== -1) {
      const block = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      const dataLines = block.split('\n')
        .filter(l => l.startsWith('data:'))
        .map(l => l.slice(5).trimStart());
      if (!dataLines.length) continue;
      let parsed;
      try { parsed = JSON.parse(dataLines.join('\n')); }
      catch { continue; }
      onEvent(parsed);
      if (parsed.type === 'done') lastDone = parsed;
      if (parsed.type === 'error') throw new Error(parsed.message || 'refine error');
    }
  }
  if (!lastDone) throw new Error('stream ended without a done event');
  return lastDone;
}

document.getElementById('btn-notes-analyze').addEventListener('click', async () => {
  const text = document.getElementById('notes-text').value.trim();
  if (!text) return;
  const title = document.getElementById('notes-title').value;
  const evts = document.getElementById('notes-events');
  const spinner = document.getElementById('notes-spinner');
  evts.hidden = false;
  evts.innerHTML = '';
  document.getElementById('btn-notes-analyze').disabled = true;
  spinner.hidden = false;
  try {
    const result = await streamNotesAnalyze(text, title, (ev) => {
      appendNotesEvent(formatNotesEvent(ev));
    });
    currentNoteId = result.note_id;
    currentOps = result.operations || [];
    document.getElementById('notes-summary').textContent =
      `Note: ${currentNoteId} — ${result.summary || ''}`;
    renderOps(currentOps);
    showNotesStep(2);
  } catch (err) {
    appendNotesEvent(`❌ ${err.message}`);
    alert('Analyze failed: ' + err.message);
  } finally {
    document.getElementById('btn-notes-analyze').disabled = false;
    spinner.hidden = true;
  }
});

function renderOps(ops) {
  // Same renderer the chat sidebar uses, so changes apply in both places.
  renderOpsRows(ops, document.getElementById('notes-ops'));
}

document.getElementById('btn-notes-back').addEventListener('click', () => showNotesStep(1));

(function wireNotesRefine() {
  const textEl = document.getElementById('notes-refine-text');
  const sendBtn = document.getElementById('btn-notes-refine-send');
  const applyBtn = document.getElementById('btn-notes-apply');
  const evts = document.getElementById('notes-refine-events');

  const spinner = document.getElementById('notes-refine-spinner');
  const send = async () => {
    const feedback = textEl.value.trim();
    if (!feedback || !currentNoteId) return;
    sendBtn.disabled = true;
    applyBtn.disabled = true;
    spinner.hidden = false;
    evts.hidden = false;
    evts.innerHTML = '';
    const append = (line) => {
      const div = document.createElement('div');
      div.textContent = line;
      evts.appendChild(div);
      evts.scrollTop = evts.scrollHeight;
    };
    try {
      const result = await streamNotesRefine(currentNoteId, currentOps, feedback, (ev) => {
        append(formatNotesEvent(ev));
      });
      currentOps = result.operations || [];
      document.getElementById('notes-summary').textContent =
        `Note: ${currentNoteId} — ${result.summary || ''}`;
      renderOps(currentOps);
      textEl.value = '';
    } catch (err) {
      append(`❌ ${err.message}`);
      alert('Refine failed: ' + err.message);
    } finally {
      sendBtn.disabled = false;
      applyBtn.disabled = false;
      spinner.hidden = true;
    }
  };

  sendBtn.addEventListener('click', send);
  textEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
})();

document.getElementById('btn-notes-apply').addEventListener('click', async () => {
  const selected = collectSelectedOps(document.getElementById('notes-ops'), currentOps);
  const applyBtn = document.getElementById('btn-notes-apply');
  const origLabel = applyBtn.textContent;
  applyBtn.disabled = true;
  applyBtn.style.display = 'inline-flex';
  applyBtn.style.alignItems = 'center';
  applyBtn.style.gap = '6px';
  applyBtn.innerHTML = '<span class="spinner" style="border-color:#fff5;border-top-color:#fff;"></span> Applying…';
  let result;
  try {
    result = await api.post('/api/notes/apply', {
      note_id: currentNoteId,
      operations: selected,
    });
  } catch (err) {
    applyBtn.disabled = false;
    applyBtn.textContent = origLabel;
    alert('Apply failed: ' + err.message);
    return;
  }
  const out = document.getElementById('notes-result');
  const skipped = result.skipped || [];
  const applied = result.applied || [];
  out.innerHTML = `
    <p>✓ Applied ${applied.length} operation(s).</p>
    ${skipped.length ? `<p>✗ Skipped ${skipped.length}:</p>
      <ul>${skipped.map(s => `<li>${escHtml(s.op && s.op.op || '')}: ${escHtml(s.reason || '')}</li>`).join('')}</ul>` : ''}
    <p>Note kept at <a href="/api/notes/${encodeURIComponent(currentNoteId)}" target="_blank">/api/notes/${escHtml(currentNoteId)}</a></p>
  `;
  document.getElementById('btn-notes-sync').hidden =
    applied.length === 0 || currentSyncMode === 'off';
  document.getElementById('btn-notes-sync').disabled = false;
  document.getElementById('btn-notes-sync').textContent = 'Sync now';
  showNotesStep(3);
  if (typeof refreshCurrentView === 'function') refreshCurrentView();
});

document.getElementById('btn-notes-sync').addEventListener('click', async () => {
  const btn = document.getElementById('btn-notes-sync');
  if (currentSyncMode === 'off') return;
  const verb = currentSyncMode === 'local' ? 'Committing' : 'Syncing';
  const okLabel = currentSyncMode === 'local' ? 'Committed ✓' : 'Synced ✓';
  btn.disabled = true;
  btn.textContent = verb + '…';
  try {
    await api.post('/api/sync/push');
    btn.textContent = okLabel;
  } catch (err) {
    btn.textContent = '✗ ' + err.message;
    btn.disabled = false;
  }
});

// Modal close
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});

// Close board edit popovers on outside click
document.addEventListener('click', () => {
  document.querySelectorAll('.board-edit-popover.visible').forEach(p => p.classList.remove('visible'));
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  const isInput = tag === 'input' || tag === 'textarea' || tag === 'select';

  if (e.key === 'Escape') {
    if (document.getElementById('modal-overlay').classList.contains('visible')) {
      closeModal();
    } else if (document.getElementById('settings-overlay').classList.contains('visible')) {
      closeSettings();
    } else if (document.getElementById('notes-overlay') && document.getElementById('notes-overlay').classList.contains('visible')) {
      document.getElementById('notes-overlay').classList.remove('visible');
    } else if (searchDropdown.classList.contains('visible')) {
      searchDropdown.classList.remove('visible');
      searchInput.value = '';
      searchInput.blur();
    }
    return;
  }

  if (isInput) return;

  switch (e.key) {
    case '1': switchView('board'); break;
    case '2': switchView('dashboard'); break;
    case '3': switchView('calendar'); break;
    case '4': switchView('table'); break;
    case 'n':
    case 'N':
      document.getElementById('btn-new-card').click();
      break;
    case '/':
      e.preventDefault();
      searchInput.focus();
      break;
  }
});

/* ================================================================
   Click-and-drag horizontal panning on the board area
   Only pans when grabbing background (not cards/columns/buttons)
   ================================================================ */
(() => {
  const pan = document.getElementById('board-columns');
  if (!pan) return;
  let active = false, lastClientX = 0, lastClientY = 0;
  const interactive = 'card,button,input,textarea,select,a,.column-cards,.swimlane-drag-handle,.board-edit-popover,.swimlane-header-name';

  pan.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    if (e.target.closest(interactive)) return;
    e.preventDefault(); // suppress native drag on any draggable descendants
    active = true;
    lastClientX = e.clientX;
    lastClientY = e.clientY;
    pan.style.userSelect = 'none';
  });
  let pendingDx = 0, pendingDy = 0, rafId = 0;
  window.addEventListener('mousemove', (e) => {
    if (!active) return;
    if (e.buttons === 0) { stop(); return; }
    // Use clientX/Y deltas — they're viewport-relative, so scrolling the
    // window doesn't poison subsequent readings the way pageY does.
    pendingDx += e.clientX - lastClientX;
    pendingDy += e.clientY - lastClientY;
    lastClientX = e.clientX;
    lastClientY = e.clientY;
    if (rafId) return;
    rafId = requestAnimationFrame(() => {
      rafId = 0;
      if (!active) return;
      pan.scrollLeft -= pendingDx;
      window.scrollBy(0, -pendingDy);
      pendingDx = 0;
      pendingDy = 0;
    });
  });
  function stop() {
    if (!active) return;
    active = false;
    pendingDx = 0;
    pendingDy = 0;
    pan.style.userSelect = '';
  }
  window.addEventListener('mouseup', stop);
  window.addEventListener('blur', stop);
  window.addEventListener('dragstart', stop);
})();

   Init
   ================================================================ */
(async () => {
  await loadBoards();
  await populateFilterOptions();
  await refreshCurrentView();
  refreshNotesButtonState();
})();
