<script>
/* ================================================================
   State
   ================================================================ */
const state = {
  boards: [],
  currentBoard: null,
  currentView: 'board',
  boardData: null,
  filters: { assignee: '', label: '', due: '' },
  calendarYear: new Date().getFullYear(),
  calendarMonth: new Date().getMonth() + 1,
  modalCard: null,
  sortColumn: 'title',
  sortAsc: true,
  idIndex: new Map(),  // id -> {title, board, list}
};

/* ================================================================
   Label Colors
   ================================================================ */
const LABEL_COLORS = {
  bug: 'label-red', urgent: 'label-red',
  frontend: 'label-blue', backend: 'label-purple',
  design: 'label-pink', feature: 'label-green',
  docs: 'label-orange', testing: 'label-yellow',
};

function labelColorClass(label) {
  return LABEL_COLORS[label.toLowerCase()] || 'label-gray';
}

/* ================================================================
   API Client
   ================================================================ */
const api = {
  async get(path) {
    const r = await fetch(path);
    if (!r.ok) throw new Error(`GET ${path}: ${r.status}`);
    return r.json();
  },
  async post(path, body) {
    const r = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error(`POST ${path}: ${r.status}`);
    return r.json();
  },
  async put(path, body) {
    const r = await fetch(path, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error(`PUT ${path}: ${r.status}`);
    return r.json();
  },
  async del(path) {
    const r = await fetch(path, { method: 'DELETE' });
    if (!r.ok) throw new Error(`DELETE ${path}: ${r.status}`);
    return r.json();
  },
};

/* ================================================================
   Helpers
   ================================================================ */
function formatListName(slug) {
  return slug.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  try {
    const d = new Date(dateStr + 'T00:00:00');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return months[d.getMonth()] + ' ' + d.getDate();
  } catch { return dateStr; }
}

function escHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function attachWikilinkTypeahead(textareaEl) {
  let popup = null;

  function close() {
    if (popup) { popup.remove(); popup = null; }
  }

  textareaEl.addEventListener('input', () => {
    const pos = textareaEl.selectionStart;
    const before = textareaEl.value.slice(0, pos);
    const m = before.match(/\[\[([\w\-\s]*)$/);
    if (!m) { close(); return; }
    const query = m[1].toLowerCase();

    // Filter idIndex entries by id-substring or title-substring.
    const matches = [];
    for (const [id, entry] of state.idIndex) {
      if (matches.length >= 8) break;
      if (id.toLowerCase().includes(query) || entry.title.toLowerCase().includes(query)) {
        matches.push({ id, ...entry });
      }
    }
    if (!matches.length) { close(); return; }

    if (!popup) {
      popup = document.createElement('div');
      popup.className = 'wikilink-popup';
      document.body.appendChild(popup);
    }
    popup.innerHTML = matches.map(c =>
      `<div class="wikilink-popup-item" data-id="${escHtml(c.id)}">
         <strong>${escHtml(c.id)}</strong> ${escHtml(c.title)}
       </div>`).join('');

    // Position below the textarea (rough positioning).
    const r = textareaEl.getBoundingClientRect();
    popup.style.left = `${r.left}px`;
    popup.style.top = `${r.bottom + 4}px`;

    popup.onclick = (e) => {
      const item = e.target.closest('.wikilink-popup-item');
      if (!item) return;
      const id = item.dataset.id;
      const newBefore = before.replace(/\[\[[\w\-\s]*$/, `[[${id}]]`);
      const after = textareaEl.value.slice(pos);
      textareaEl.value = newBefore + after;
      textareaEl.selectionStart = textareaEl.selectionEnd = newBefore.length;
      close();
    };
  });

  textareaEl.addEventListener('blur', () => setTimeout(close, 150));
}

// Render free-form text as HTML with links auto-detected. Supports:
//   [label](url)            → <a href="url">label</a>
//   http(s)://… or www.…    → <a href="…">…</a>
// All non-link content is escaped first, so user content can't inject HTML.
function indexCards(cards) {
  if (!Array.isArray(cards)) return;
  for (const c of cards) {
    if (c && c.id) {
      state.idIndex.set(c.id, {
        title: c.title || '',
        board: c.board || '',
        list: c.list || '',
      });
    }
  }
}

function linkifyHtml(str) {
  if (!str) return '';
  const out = [];
  let i = 0;
  // Wikilinks first ([[C-N]]), then markdown links, then bare URLs.
  const re = /\[\[(C-\d+)\]\]|\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|(\bhttps?:\/\/[^\s<>"']+|\bwww\.[^\s<>"']+)/g;
  let m;
  while ((m = re.exec(str)) !== null) {
    if (m.index > i) out.push(escHtml(str.slice(i, m.index)));
    if (m[1] !== undefined) {
      // Wikilink form
      const id = m[1];
      const entry = state.idIndex.get(id);
      if (entry) {
        out.push(`<a href="#" class="card-link" data-id="${escHtml(id)}">${escHtml(id)}: ${escHtml(entry.title)}</a>`);
      } else {
        out.push(`<span class="card-link missing" title="Unknown card">[[${escHtml(id)} ?]]</span>`);
      }
    } else if (m[2] !== undefined) {
      // Markdown form
      out.push(`<a href="${escHtml(m[3])}" target="_blank" rel="noopener noreferrer">${escHtml(m[2])}</a>`);
    } else {
      let url = m[4];
      // Strip trailing punctuation that's almost always sentence punctuation
      let trail = '';
      while (url.length && '.,;:!?)'.includes(url[url.length - 1])) {
        trail = url[url.length - 1] + trail;
        url = url.slice(0, -1);
      }
      const href = url.startsWith('www.') ? 'https://' + url : url;
      out.push(`<a href="${escHtml(href)}" target="_blank" rel="noopener noreferrer">${escHtml(url)}</a>`);
      if (trail) out.push(escHtml(trail));
    }
    i = m.index + m[0].length;
  }
  if (i < str.length) out.push(escHtml(str.slice(i)));
  return out.join('');
}

function isOverdue(dateStr) {
  if (!dateStr) return false;
  const today = new Date();
  today.setHours(0,0,0,0);
  const due = new Date(dateStr + 'T00:00:00');
  return due < today;
}

function isDueToday(dateStr) {
  if (!dateStr) return false;
  const today = new Date();
  const todayStr = today.getFullYear() + '-' +
    String(today.getMonth()+1).padStart(2,'0') + '-' +
    String(today.getDate()).padStart(2,'0');
  return dateStr === todayStr;
}

function isDueThisWeek(dateStr) {
  if (!dateStr) return false;
  const today = new Date();
  today.setHours(0,0,0,0);
  const due = new Date(dateStr + 'T00:00:00');
  const weekEnd = new Date(today);
  const daysUntilSunday = (7 - today.getDay()) % 7;
  weekEnd.setDate(weekEnd.getDate() + daysUntilSunday);
  return due > today && due <= weekEnd;
}

function parseChecklistFromBody(card) {
  if (typeof card.checklist_total === 'number') {
    return { done: card.checklist_done || 0, total: card.checklist_total };
  }
  const body = card.body || '';
  const section = body.match(/## Checklist\n\n([\s\S]*?)(\n+## |$)/);
  const scope = section ? section[1] : '';
  const checked = (scope.match(/- \[x\]/gi) || []).length;
  const unchecked = (scope.match(/- \[ \]/g) || []).length;
  return { done: checked, total: checked + unchecked };
}

function parseChecklistItems(body) {
  const section = body.match(/## Checklist\n\n([\s\S]*?)(\n+## |$)/);
  if (!section) return [];
  const items = [];
  const lines = section[1].split('\n');
  for (const line of lines) {
    const m = line.match(/^- \[(x| )\] (.+)$/i);
    if (m) {
      items.push({ done: m[1].toLowerCase() === 'x', text: m[2] });
    }
  }
  return items;
}

function buildChecklistString(items) {
  return items.map(i => `- [${i.done ? 'x' : ' '}] ${i.text}`).join('\n');
}

function parseDescription(body) {
  const m = body.match(/## Description\n\n([\s\S]*?)(\n+## |$)/);
  return m ? m[1].trim() : '';
}

function parseComments(body) {
  const section = body.match(/## Comments\n\n([\s\S]*?)$/);
  if (!section) return [];
  const comments = [];
  const blocks = section[1].split(/\n\n(?=\*\*)/);
  for (const block of blocks) {
    const m = block.match(/^\*\*(.+?) - (.+?):\*\*\n([\s\S]+)/);
    if (m) {
      comments.push({ date: m[1], author: m[2], text: m[3].trim() });
    }
  }
  return comments;
}

function getDragAfterElement(container, y) {
  const cards = [...container.querySelectorAll('.card:not(.dragging)')];
  return cards.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closest.offset) {
      return { offset, element: child };
    }
    return closest;
  }, { offset: Number.NEGATIVE_INFINITY }).element;
}

/* ================================================================
   Load Boards
   ================================================================ */
async function loadBoards() {
  try {
    state.boards = await api.get('/api/boards');
  } catch {
    state.boards = [];
  }
  const sel = document.getElementById('board-select');
  sel.innerHTML = '';
  if (state.boards.length === 0) {
    sel.innerHTML = '<option value="">No boards</option>';
  } else {
    for (const b of state.boards) {
      const opt = document.createElement('option');
      opt.value = b.slug;
      opt.textContent = b.name;
      sel.appendChild(opt);
    }
  }
  // Add "New Board" option
  const newOpt = document.createElement('option');
  newOpt.value = '__new__';
  newOpt.textContent = '+ New Board...';
  sel.appendChild(newOpt);

  if (!state.currentBoard && state.boards.length > 0) {
    state.currentBoard = state.boards[0].slug;
  }
  if (state.currentBoard) {
    sel.value = state.currentBoard;
  }
}

/* ================================================================
   Filter Options
   ================================================================ */
async function populateFilterOptions() {
  if (!state.boards || state.boards.length === 0) return;
  try {
    const assignees = new Set();
    const labels = new Set();
    for (const b of state.boards) {
      let data;
      try {
        data = await api.get('/api/boards/' + b.slug);
      } catch { continue; }
      let hasUnassigned = false;
      for (const listName of Object.keys(data.lists || {})) {
        for (const c of (data.lists[listName] || [])) {
          if (c.assignee) assignees.add(c.assignee);
          else hasUnassigned = true;
          const cl = c.labels || [];
          for (const l of (Array.isArray(cl) ? cl : [])) labels.add(l);
        }
      }
      if (hasUnassigned) assignees.add('__unassigned__');
    }
    const asel = document.getElementById('filter-assignee');
    asel.innerHTML = '<option value="">All Assignees</option>';
    const sorted = [...assignees].filter(a => a !== '__unassigned__').sort();
    if (assignees.has('__unassigned__')) {
      asel.innerHTML += `<option value="__unassigned__">(Unassigned)</option>`;
    }
    for (const a of sorted) {
      asel.innerHTML += `<option value="${escHtml(a)}">${escHtml(a)}</option>`;
    }
    const lsel = document.getElementById('filter-label');
    lsel.innerHTML = '<option value="">All Labels</option>';
    for (const l of [...labels].sort()) {
      lsel.innerHTML += `<option value="${escHtml(l)}">${escHtml(l)}</option>`;
    }
    asel.value = state.filters.assignee;
    lsel.value = state.filters.label;
  } catch { /* ignore */ }
}

function renderFilterChips() {
  const container = document.getElementById('filter-chips');
  container.innerHTML = '';
  if (state.filters.assignee) {
    const label = state.filters.assignee === '__unassigned__' ? 'Unassigned' : state.filters.assignee;
    container.innerHTML += `<span class="filter-chip">Assignee: ${escHtml(label)} <button class="chip-remove" data-filter="assignee">&times;</button></span>`;
  }
  if (state.filters.label) {
    container.innerHTML += `<span class="filter-chip">Label: ${escHtml(state.filters.label)} <button class="chip-remove" data-filter="label">&times;</button></span>`;
  }
  if (state.filters.due) {
    container.innerHTML += `<span class="filter-chip">Due: ${escHtml(state.filters.due)} <button class="chip-remove" data-filter="due">&times;</button></span>`;
  }
  container.querySelectorAll('.chip-remove').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const f = e.target.dataset.filter;
      state.filters[f] = '';
      document.getElementById('filter-' + f).value = '';
      renderFilterChips();
      refreshCurrentView();
    });
  });
}

function applyFilters(cards) {
  return cards.filter(c => {
    if (state.filters.assignee) {
      if (state.filters.assignee === '__unassigned__') {
        if (c.assignee) return false;
      } else if (c.assignee !== state.filters.assignee) {
        return false;
      }
    }
    if (state.filters.label) {
      const labels = Array.isArray(c.labels) ? c.labels : [];
      if (!labels.includes(state.filters.label)) return false;
    }
    if (state.filters.due) {
      const due = c.due || '';
      switch (state.filters.due) {
        case 'overdue': if (!isOverdue(due)) return false; break;
        case 'today': if (!isDueToday(due)) return false; break;
        case 'week': if (!isDueThisWeek(due)) return false; break;
        case 'none': if (due) return false; break;
      }
    }
    return true;
  });
}

/* ================================================================
   View Switching
   ================================================================ */
function switchView(view) {
  state.currentView = view;
  document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  document.querySelectorAll('.view-switcher button').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });
  const filterBar = document.getElementById('filter-bar');
  if (view === 'board' || view === 'table') {
    filterBar.classList.add('visible');
  } else {
    filterBar.classList.remove('visible');
  }
  document.getElementById('lane-sidebar').style.display = (view === 'board') ? '' : 'none';
  refreshCurrentView();
}

async function refreshCurrentView() {
  switch (state.currentView) {
    case 'board': await renderBoard(); break;
    case 'dashboard': await renderDashboard(); break;
    case 'calendar': await renderCalendar(); break;
    case 'table': await renderTable(); break;
  }
  if (state.modalCard) flashSaved();
}

/* ================================================================
   Board View
   ================================================================ */
async function moveBoard(slug, delta) {
  const idx = state.boards.findIndex(b => b.slug === slug);
  if (idx < 0) return;
  const target = idx + delta;
  if (target < 0 || target >= state.boards.length) return;
  const reordered = [...state.boards];
  const [moved] = reordered.splice(idx, 1);
  reordered.splice(target, 0, moved);
  state.boards = reordered;
  const newOrder = reordered.map(b => b.slug);
  try {
    await api.put('/api/boards-order', newOrder);
  } catch (err) {
    console.error('Failed to save board order:', err);
  }
  await renderBoard();
}

let _renderBoardToken = 0;
async function renderBoard() {
  const myToken = ++_renderBoardToken;
  const container = document.getElementById('board-columns');
  if (state.boards.length === 0) {
    container.innerHTML = '<div style="padding:40px;color:#5e6c84;text-align:center;">No boards yet. Create a board to get started.</div>';
    return;
  }

  // Fetch all boards in parallel before touching the DOM, so a stale render
  // can't interleave appends with a fresher one.
  const boardDataList = await Promise.all(
    state.boards.map(b => api.get('/api/boards/' + b.slug).catch(() => null))
  );
  if (myToken !== _renderBoardToken) return; // a newer render superseded us

  container.innerHTML = '';

  // Index all cards from all boards
  for (const boardData of boardDataList) {
    if (boardData && boardData.lists) {
      for (const cards of Object.values(boardData.lists)) {
        indexCards(cards);
      }
    }
  }

  for (let boardIdx = 0; boardIdx < state.boards.length; boardIdx++) {
    const boardInfo = state.boards[boardIdx];
    const boardData = boardDataList[boardIdx];
    if (!boardData) continue;
    const lists = boardData.lists || {};
    const listOrder = ['ideas', 'backlog', 'in-progress', 'done'];
    const boardColor = boardData.color || '#4A90D9';
    const totalCards = listOrder.reduce((sum, l) => sum + (lists[l] || []).length, 0);
    const isFirst = boardIdx === 0;
    const isLast = boardIdx === state.boards.length - 1;

    const lane = document.createElement('div');
    lane.className = 'swimlane';
    lane.dataset.board = boardInfo.slug;
    lane.innerHTML = `
      <div class="swimlane-header">
        <div class="swimlane-move-btns">
          <button class="swimlane-move-btn move-up" title="Move up"${isFirst ? ' disabled' : ''}>&#x25B2;</button>
          <button class="swimlane-move-btn move-down" title="Move down"${isLast ? ' disabled' : ''}>&#x25BC;</button>
        </div>
        <div class="swimlane-drag-handle" title="Drag to reorder">&#x2630;</div>
        <div class="swimlane-color" style="background:${escHtml(boardColor)}"></div>
        <span class="swimlane-toggle">&#x25BE;</span>
        <span class="swimlane-header-name" data-board="${escHtml(boardInfo.slug)}">${escHtml(boardData.name || boardInfo.slug)}</span>
        <span class="swimlane-card-count">${totalCards}</span>
        <button class="swimlane-delete" data-board="${escHtml(boardInfo.slug)}" data-name="${escHtml(boardData.name || boardInfo.slug)}" title="Delete empty lane"${totalCards === 0 ? '' : ' style="display:none"'}>&#128465;</button>
        <div class="board-edit-popover" data-board="${escHtml(boardInfo.slug)}">
          <label>Board Name</label>
          <input type="text" class="be-name" value="${escHtml(boardData.name || '')}" />
          <label>Color</label>
          <input type="color" class="be-color" value="${escHtml(boardColor)}" />
        </div>
      </div>
      <div class="swimlane-columns"></div>
    `;

    const collapsedSet = JSON.parse(localStorage.getItem('atc-collapsed-lanes') || '[]');
    if (collapsedSet.includes(boardInfo.slug)) lane.classList.add('collapsed');

    const header = lane.querySelector('.swimlane-header');

    const moveUpBtn = header.querySelector('.move-up');
    const moveDownBtn = header.querySelector('.move-down');
    moveUpBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      moveBoard(boardInfo.slug, -1);
    });
    moveDownBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      moveBoard(boardInfo.slug, 1);
    });

    const delBtn = header.querySelector('.swimlane-delete');
    if (delBtn) {
      delBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const slug = delBtn.dataset.board;
        const name = delBtn.dataset.name;
        if (!confirm(`Delete empty lane "${name}"? This cannot be undone.`)) return;
        try {
          await api.del(`/api/boards/${slug}`);
          await loadBoards();
          await refreshCurrentView();
        } catch (err) {
          alert(`Failed to delete lane: ${err.message}`);
        }
      });
    }

    const toggle = header.querySelector('.swimlane-toggle');
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      lane.classList.toggle('collapsed');
      const stored = JSON.parse(localStorage.getItem('atc-collapsed-lanes') || '[]');
      const slug = boardInfo.slug;
      if (lane.classList.contains('collapsed')) {
        if (!stored.includes(slug)) stored.push(slug);
      } else {
        const idx = stored.indexOf(slug);
        if (idx !== -1) stored.splice(idx, 1);
      }
      localStorage.setItem('atc-collapsed-lanes', JSON.stringify(stored));
    });

    const nameEl = header.querySelector('.swimlane-header-name');
    const popover = header.querySelector('.board-edit-popover');

    nameEl.addEventListener('click', (e) => {
      e.stopPropagation();
      document.querySelectorAll('.board-edit-popover.visible').forEach(p => p.classList.remove('visible'));
      popover.classList.toggle('visible');
    });

    const saveBoard = async () => {
      const newName = popover.querySelector('.be-name').value.trim();
      const newColor = popover.querySelector('.be-color').value;
      if (!newName) return;
      await api.put('/api/boards/' + boardInfo.slug, { name: newName, color: newColor });
      nameEl.textContent = newName;
      lane.querySelector('.swimlane-color').style.background = newColor;
      await loadBoards();
    };

    popover.querySelector('.be-name').addEventListener('blur', saveBoard);
    popover.querySelector('.be-color').addEventListener('input', saveBoard);

    popover.addEventListener('click', (e) => e.stopPropagation());

    const columnsContainer = lane.querySelector('.swimlane-columns');

    for (const listSlug of listOrder) {
      const rawCards = lists[listSlug] || [];
      const cards = applyFilters(rawCards);
      const col = document.createElement('div');
      col.className = 'board-column';
      col.dataset.list = listSlug;
      col.innerHTML = `
        <div class="column-header">
          <span>${formatListName(listSlug)}</span>
          <span class="card-count">${cards.length}</span>
        </div>
        <div class="column-cards" data-list="${listSlug}" data-board="${escHtml(boardInfo.slug)}">
        </div>
      `;
      const cardsContainer = col.querySelector('.column-cards');

      for (const card of cards) {
        cardsContainer.appendChild(createCardElement(card));
      }

      const addBtn = document.createElement('button');
      addBtn.className = 'column-add-card';
      addBtn.textContent = '+ New Card';
      addBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openNewCardDialog(boardInfo.slug, listSlug);
      });
      cardsContainer.appendChild(addBtn);

      setupDropZone(cardsContainer);
      columnsContainer.appendChild(col);
    }

    container.appendChild(lane);
  }

  setupSwimlaneDrag(container);

  const sidebar = document.getElementById('lane-sidebar');
  sidebar.innerHTML = '';
  container.querySelectorAll('.swimlane').forEach(lane => {
    const slug = lane.dataset.board;
    const name = lane.querySelector('.swimlane-header-name')?.textContent || slug;
    const color = lane.querySelector('.swimlane-color')?.style.background || '#4A90D9';
    const count = (lane.querySelector('.swimlane-card-count')?.textContent || '0').trim();
    const item = document.createElement('div');
    item.className = 'lane-sidebar-item';
    item.title = name;
    item.innerHTML = `
      <div class="sidebar-color" style="background:${color}"></div>
      <span class="sidebar-name">${escHtml(name)}</span>
    `;
    item.addEventListener('click', () => {
      const filterBar = document.getElementById('filter-bar');
      const offset = 48 + (filterBar?.offsetHeight || 0) + 8;
      const y = lane.getBoundingClientRect().top + window.scrollY - offset;
      window.scrollTo({ top: y, behavior: 'smooth' });
    });
    sidebar.appendChild(item);
  });
}

function setupSwimlaneDrag(container) {
  let draggedLane = null;

  container.querySelectorAll('.swimlane').forEach(lane => {
    const handle = lane.querySelector('.swimlane-drag-handle');

    handle.addEventListener('mousedown', () => {
      lane.draggable = true;
    });

    lane.addEventListener('mousedown', (e) => {
      if (lane.classList.contains('collapsed') && !e.target.closest('.swimlane-toggle') && !e.target.closest('.swimlane-header-name')) {
        lane.draggable = true;
      }
    });

    lane.addEventListener('dragstart', (e) => {
      if (!e.target.classList.contains('swimlane')) return;
      draggedLane = lane;
      lane.classList.add('dragging-lane');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', lane.dataset.board);
    });

    lane.addEventListener('dragend', () => {
      lane.draggable = false;
      lane.classList.remove('dragging-lane');
      container.querySelectorAll('.swimlane').forEach(l => {
        l.classList.remove('drop-target-above', 'drop-target-below');
      });
      draggedLane = null;
    });
  });

  container.querySelectorAll('.swimlane').forEach(lane => {
    lane.addEventListener('dragover', (e) => {
      if (!draggedLane || draggedLane === lane) return;
      // Only handle swimlane drags, not card drags
      if (!draggedLane.classList.contains('swimlane')) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const rect = lane.getBoundingClientRect();
      const midY = rect.top + rect.height / 2;
      lane.classList.remove('drop-target-above', 'drop-target-below');
      if (e.clientY < midY) {
        lane.classList.add('drop-target-above');
      } else {
        lane.classList.add('drop-target-below');
      }
    });

    lane.addEventListener('dragleave', () => {
      lane.classList.remove('drop-target-above', 'drop-target-below');
    });

    lane.addEventListener('drop', async (e) => {
      if (!draggedLane || draggedLane === lane) return;
      if (!draggedLane.classList.contains('swimlane')) return;
      e.preventDefault();
      lane.classList.remove('drop-target-above', 'drop-target-below');

      const rect = lane.getBoundingClientRect();
      const midY = rect.top + rect.height / 2;
      if (e.clientY < midY) {
        container.insertBefore(draggedLane, lane);
      } else {
        container.insertBefore(draggedLane, lane.nextSibling);
      }

      // Persist new order
      const newOrder = [...container.querySelectorAll('.swimlane')].map(l => l.dataset.board);
      const bySlug = Object.fromEntries(state.boards.map(b => [b.slug, b]));
      state.boards = newOrder.map(s => bySlug[s]).filter(Boolean);
      try {
        await api.put('/api/boards-order', newOrder);
      } catch (err) {
        console.error('Failed to save board order:', err);
      }
    });
  });
}

function createCardElement(card) {
  const cardEl = document.createElement('div');
  cardEl.className = 'card';
  cardEl.draggable = true;
  cardEl.dataset.card = card.slug;
  cardEl.dataset.board = card.board;
  cardEl.dataset.list = card.list;

  const cl = parseChecklistFromBody(card);
  let checkHtml = '';
  if (cl.total > 0) {
    const pct = Math.round((cl.done / cl.total) * 100);
    checkHtml = `<span class="card-checklist-bar" title="${cl.done} of ${cl.total} done">
      <div class="checklist-progress"><div class="checklist-progress-fill" style="width:${pct}%"></div></div>
      <span>${cl.done}/${cl.total}</span>
    </span>`;
  }

  const assignee = typeof card.assignee === 'string' ? card.assignee : '';
  const due = typeof card.due === 'string' ? card.due : '';
  const dueClass = due ? (isOverdue(due) && card.list !== 'done' ? 'overdue' : '') : 'missing';
  const assigneeHtml = assignee
    ? `<span class="card-assignee">${escHtml(assignee)}</span>`
    : `<span class="card-assignee missing">Unassigned</span>`;
  const dueHtml = `<span class="card-due ${dueClass}">${due ? formatDate(due) : 'No due-date'}</span>`;
  const metaHtml = `<div class="card-meta">${assigneeHtml}${dueHtml}</div>`;

  cardEl.innerHTML = `${checkHtml}<div class="card-title"><span class="card-id-chip">${escHtml(card.id || card.slug)}</span><span>${escHtml(card.title)}</span></div>${metaHtml}`;

  cardEl.addEventListener('click', () => {
    const currentBoard = cardEl.dataset.board;
    const currentList = cardEl.closest('.column-cards')?.dataset.list || card.list;
    openCardModal(currentBoard, currentList, card.slug);
  });
  cardEl.addEventListener('dragstart', (e) => {
    cardEl.classList.add('dragging');
    const currentBoard = cardEl.dataset.board;
    const currentList = cardEl.closest('.column-cards')?.dataset.list || card.list;
    e.dataTransfer.setData('text/plain', JSON.stringify({
      card: card.slug, board: currentBoard, list: currentList,
    }));
    e.dataTransfer.effectAllowed = 'move';
  });
  cardEl.addEventListener('dragend', () => {
    cardEl.classList.remove('dragging');
    document.querySelectorAll('.column-cards.drag-over').forEach(c => c.classList.remove('drag-over'));
    removeDropIndicators();
  });

  return cardEl;
}

function updateCardCount(cardsContainer) {
  const col = cardsContainer.closest('.board-column');
  if (col) {
    const countEl = col.querySelector('.card-count');
    if (countEl) countEl.textContent = cardsContainer.querySelectorAll('.card').length;
  }
  // Per-board total in the swimlane header.
  const swimlane = cardsContainer.closest('.swimlane');
  if (swimlane) {
    const total = swimlane.querySelectorAll('.column-cards .card').length;
    const totalEl = swimlane.querySelector('.swimlane-card-count');
    if (totalEl) totalEl.textContent = total;
    const delBtn = swimlane.querySelector('.swimlane-delete');
    if (delBtn) delBtn.style.display = (total === 0) ? '' : 'none';
  }
}

function removeDropIndicators() {
  document.querySelectorAll('.card-drop-indicator').forEach(el => el.remove());
}

function showDropIndicator(container, y) {
  removeDropIndicators();
  const indicator = document.createElement('div');
  indicator.className = 'card-drop-indicator';
  const afterEl = getDragAfterElement(container, y);
  const addBtn = container.querySelector('.column-add-card');
  if (afterEl) {
    container.insertBefore(indicator, afterEl);
  } else {
    container.insertBefore(indicator, addBtn);
  }
}

function setupDropZone(cardsContainer) {
  cardsContainer.addEventListener('dragover', (e) => {
    // Check if this is a swimlane drag (not a card drag) — ignore it
    if (document.querySelector('.swimlane.dragging-lane')) return;
    e.preventDefault();
    e.stopPropagation();
    e.dataTransfer.dropEffect = 'move';
    cardsContainer.classList.add('drag-over');
    showDropIndicator(cardsContainer, e.clientY);
  });
  cardsContainer.addEventListener('dragleave', (e) => {
    if (!cardsContainer.contains(e.relatedTarget)) {
      cardsContainer.classList.remove('drag-over');
      removeDropIndicators();
    }
  });
  cardsContainer.addEventListener('drop', async (e) => {
    if (document.querySelector('.swimlane.dragging-lane')) return;
    e.preventDefault();
    e.stopPropagation();
    cardsContainer.classList.remove('drag-over');
    removeDropIndicators();
    let dragData;
    try { dragData = JSON.parse(e.dataTransfer.getData('text/plain')); } catch { return; }
    const targetList = cardsContainer.dataset.list;
    const targetBoard = cardsContainer.dataset.board;
    const afterEl = getDragAfterElement(cardsContainer, e.clientY);
    let position = -1;
    if (afterEl) {
      const allCards = [...cardsContainer.querySelectorAll('.card:not(.dragging)')];
      position = allCards.indexOf(afterEl);
    }

    const draggedCard = document.querySelector(`.card[data-card="${dragData.card}"][data-board="${dragData.board}"]`);
    if (draggedCard) {
      const sourceContainer = draggedCard.closest('.column-cards');
      draggedCard.classList.remove('dragging');
      draggedCard.dataset.board = targetBoard;
      const addBtn = cardsContainer.querySelector('.column-add-card');
      if (afterEl) {
        cardsContainer.insertBefore(draggedCard, afterEl);
      } else {
        cardsContainer.insertBefore(draggedCard, addBtn);
      }
      draggedCard.classList.add('card-settling');
      draggedCard.addEventListener('animationend', () => draggedCard.classList.remove('card-settling'), { once: true });
      updateCardCount(sourceContainer);
      updateCardCount(cardsContainer);
    }

    try {
      await api.put(`/api/cards/${dragData.board}/${dragData.list}/${dragData.card}/move`, {
        target_list: targetList,
        target_board: targetBoard,
        position: position,
      });
    } catch (err) {
      console.error('Move failed:', err);
      await renderBoard();
    }
  });
}

/* ================================================================
   Dashboard View
   ================================================================ */
async function renderDashboard() {
  const container = document.getElementById('dashboard-content');
  let data;
  try {
    data = await api.get('/api/dashboard');
  } catch {
    container.innerHTML = '<div class="dash-empty">Failed to load dashboard.</div>';
    return;
  }
  container.innerHTML = '';

  // Index all cards from all buckets
  indexCards(data.overdue || []);
  indexCards(data.today || []);
  indexCards(data.this_week || []);
  indexCards(data.next_week || []);
  indexCards(data.later || []);
  indexCards(data.someday || []);

  function groupByBoard(cards) {
    const groups = {};
    for (const c of cards) {
      const boardName = c.board || 'Unknown';
      if (!groups[boardName]) groups[boardName] = [];
      groups[boardName].push(c);
    }
    return groups;
  }

  function renderSection(title, cssClass, bucket, cards) {
    const groups = groupByBoard(cards);
    let html = `<div class="dash-section ${cssClass}" data-bucket="${bucket}">
      <div class="dash-section-title ${cssClass}"><span>${title}</span><span class="dash-section-card-count">${cards.length}</span></div>`;
    if (cards.length === 0) {
      html += '<div class="dash-empty">No cards</div>';
    } else {
      for (const [board, boardCards] of Object.entries(groups)) {
        html += `<div class="dash-group-title">${escHtml(board)}</div>`;
        for (const c of boardCards) {
          const labels = Array.isArray(c.labels) ? c.labels : [];
          const labelDots = labels.map(l => `<div class="dash-label-dot ${labelColorClass(l)}" title="${escHtml(l)}"></div>`).join('');
          const dueClass = c.due && isOverdue(c.due) && c.list !== 'done' ? 'overdue' : '';
          html += `<div class="dash-card" draggable="true" data-board="${escHtml(c.board)}" data-list="${escHtml(c.list)}" data-card="${escHtml(c.slug)}">
            <div class="dash-labels">${labelDots}</div>
            <span class="dash-title">${escHtml(c.title)}</span>
            <span class="dash-list">${formatListName(c.list)}</span>
            <span class="dash-due ${dueClass}">${formatDate(c.due)}</span>
          </div>`;
        }
      }
    }
    html += '</div>';
    return html;
  }

  container.innerHTML =
    renderSection('Overdue',   'overdue',   'overdue',   data.overdue || []) +
    renderSection('Today',     'today',     'today',     data.today || []) +
    renderSection('This Week', 'week',      'this_week', data.this_week || []) +
    renderSection('Next Week', 'next-week', 'next_week', data.next_week || []) +
    renderSection('Later',     'later',     'later',     data.later || []) +
    renderSection('Someday',   'someday',   'someday',   data.someday || []);

  container.querySelectorAll('.dash-card').forEach(el => {
    el.addEventListener('click', () => {
      openCardModal(el.dataset.board, el.dataset.list, el.dataset.card);
    });
    el.addEventListener('dragstart', (e) => {
      el.classList.add('dragging');
      e.dataTransfer.setData('text/plain', JSON.stringify({
        board: el.dataset.board, list: el.dataset.list, card: el.dataset.card,
      }));
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      container.querySelectorAll('.dash-section.drag-over')
        .forEach(s => s.classList.remove('drag-over', 'no-drop'));
    });
  });

  container.querySelectorAll('.dash-section').forEach(section => {
    const bucket = section.dataset.bucket;
    section.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (bucket === 'overdue') {
        e.dataTransfer.dropEffect = 'none';
        section.classList.add('drag-over', 'no-drop');
      } else {
        e.dataTransfer.dropEffect = 'move';
        section.classList.add('drag-over');
      }
    });
    section.addEventListener('dragleave', (e) => {
      // Only clear when actually leaving the section, not entering a child.
      if (!section.contains(e.relatedTarget)) {
        section.classList.remove('drag-over', 'no-drop');
      }
    });
    section.addEventListener('drop', async (e) => {
      e.preventDefault();
      section.classList.remove('drag-over', 'no-drop');
      if (bucket === 'overdue') return;
      let payload;
      try { payload = JSON.parse(e.dataTransfer.getData('text/plain')); }
      catch { return; }
      const newDue = bucketToDueDate(bucket);

      const cardEl = container.querySelector(
        `.dash-card[data-board="${CSS.escape(payload.board)}"][data-list="${CSS.escape(payload.list)}"][data-card="${CSS.escape(payload.card)}"]`
      );
      if (!cardEl) return;
      const sourceSection = cardEl.closest('.dash-section');
      if (sourceSection === section) return;

      moveDashCardTo(cardEl, section, payload.board, newDue);

      try {
        await api.put(
          `/api/cards/${payload.board}/${payload.list}/${payload.card}`,
          { due: newDue });
      } catch (err) {
        alert('Failed to update due date: ' + err.message);
        await renderDashboard();
      }
    });
  });
}

function updateCardChecklistBar(board, list, slug, card) {
  const cardEl = document.querySelector(
    `.card[data-board="${CSS.escape(board)}"][data-list="${CSS.escape(list)}"][data-card="${CSS.escape(slug)}"]`
  );
  if (!cardEl) return;
  const oldBar = cardEl.querySelector(':scope > .card-checklist-bar');
  if (oldBar) oldBar.remove();
  const cl = parseChecklistFromBody(card);
  if (cl.total > 0) {
    const pct = Math.round((cl.done / cl.total) * 100);
    const span = document.createElement('span');
    span.className = 'card-checklist-bar';
    span.title = `${cl.done} of ${cl.total} done`;
    span.innerHTML = `
      <div class="checklist-progress"><div class="checklist-progress-fill" style="width:${pct}%"></div></div>
      <span>${cl.done}/${cl.total}</span>`;
    const titleEl = cardEl.querySelector('.card-title');
    cardEl.insertBefore(span, titleEl);
  }
}

function moveDashCardTo(cardEl, destSection, boardName, newDueIso) {
  const sourceSection = cardEl.closest('.dash-section');

  // Update the card's own due-date label and overdue class.
  const dueEl = cardEl.querySelector('.dash-due');
  if (dueEl) {
    dueEl.textContent = formatDate(newDueIso);
    dueEl.classList.toggle('overdue', !!newDueIso && isOverdue(newDueIso) && cardEl.dataset.list !== 'done');
  }

  // Find or create the per-board group inside the destination section.
  const titles = [...destSection.querySelectorAll('.dash-group-title')];
  let groupTitle = titles.find(t => t.textContent === boardName);
  if (!groupTitle) {
    // Section may currently show "No cards" — clear it first.
    const empty = destSection.querySelector('.dash-empty');
    if (empty) empty.remove();
    groupTitle = document.createElement('div');
    groupTitle.className = 'dash-group-title';
    groupTitle.textContent = boardName;
    destSection.appendChild(groupTitle);
  }

  // Insert the card right after the group's last card (or right after the title).
  let insertAfter = groupTitle;
  let next = groupTitle.nextElementSibling;
  while (next && next.classList.contains('dash-card')) {
    insertAfter = next;
    next = next.nextElementSibling;
  }
  insertAfter.after(cardEl);

  // Animate the moved card.
  cardEl.classList.add('card-settling');
  cardEl.addEventListener('animationend', () => cardEl.classList.remove('card-settling'), { once: true });

  // Clean up the source group: drop its title if empty, replace section body if empty.
  const sourceTitles = [...sourceSection.querySelectorAll('.dash-group-title')];
  const sourceGroupTitle = sourceTitles.find(t => t.textContent === boardName);
  if (sourceGroupTitle) {
    const after = sourceGroupTitle.nextElementSibling;
    if (!after || !after.classList.contains('dash-card')) {
      sourceGroupTitle.remove();
    }
  }
  if (!sourceSection.querySelector('.dash-card')) {
    const empty = document.createElement('div');
    empty.className = 'dash-empty';
    empty.textContent = 'No cards';
    sourceSection.appendChild(empty);
  }

  // Update the count badges on both sections.
  for (const s of [sourceSection, destSection]) {
    const badge = s.querySelector('.dash-section-card-count');
    if (badge) badge.textContent = s.querySelectorAll('.dash-card').length;
  }
}

function bucketToDueDate(bucket) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  function fmt(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function fridayOfWeek(weeksAhead) {
    const d = new Date(today);
    const dow = d.getDay();              // 0 = Sun, 5 = Fri
    const diff = (5 - dow + 7) % 7;      // days to upcoming Friday (0 if today is Friday)
    d.setDate(d.getDate() + diff + weeksAhead * 7);
    return d;
  }
  switch (bucket) {
    case 'today':     return fmt(today);
    case 'this_week': return fmt(fridayOfWeek(0));
    case 'next_week': return fmt(fridayOfWeek(1));
    case 'later':     return fmt(fridayOfWeek(3));
    case 'someday':   return '';
    default:          return '';
  }
}

/* ================================================================
   Calendar View
   ================================================================ */
async function renderCalendar() {
  const container = document.getElementById('calendar-content');
  const year = state.calendarYear;
  const month = state.calendarMonth;
  let cards;
  try {
    cards = await api.get(`/api/calendar/${year}/${month}`);
  } catch {
    cards = [];
  }
  indexCards(cards);
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const today = new Date();
  const todayStr = today.getFullYear() + '-' +
    String(today.getMonth()+1).padStart(2,'0') + '-' +
    String(today.getDate()).padStart(2,'0');

  // Calendar math
  const firstDay = new Date(year, month - 1, 1);
  const lastDay = new Date(year, month, 0);
  const startDow = (firstDay.getDay() + 6) % 7; // 0=Mon
  const daysInMonth = lastDay.getDate();

  // Group cards by day
  const cardsByDay = {};
  for (const c of cards) {
    if (!c.due) continue;
    const d = parseInt(c.due.split('-')[2], 10);
    if (!cardsByDay[d]) cardsByDay[d] = [];
    cardsByDay[d].push(c);
  }

  let html = `
    <div class="calendar-header">
      <button id="cal-prev">&larr; Prev</button>
      <div class="cal-title">${months[month-1]} ${year}</div>
      <button id="cal-next">Next &rarr;</button>
    </div>
    <div class="calendar-grid">
  `;
  const dayHeaders = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  for (const dh of dayHeaders) {
    html += `<div class="cal-day-header">${dh}</div>`;
  }

  // Padding cells for previous month
  for (let i = 0; i < startDow; i++) {
    html += '<div class="cal-day padding"></div>';
  }

  // Day cells
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = year + '-' + String(month).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    const isToday = dateStr === todayStr;
    html += `<div class="cal-day${isToday ? ' today' : ''}">
      <div class="cal-day-num">${d}</div>`;
    const dayCards = cardsByDay[d] || [];
    for (const c of dayCards) {
      const overdueClass = isOverdue(c.due) && c.list !== 'done' ? ' overdue' : '';
      html += `<div class="cal-card${overdueClass}" data-board="${escHtml(c.board)}" data-list="${escHtml(c.list)}" data-card="${escHtml(c.slug)}">${escHtml(c.title)}</div>`;
    }
    html += '</div>';
  }

  // Padding cells for next month
  const totalCells = startDow + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let i = 0; i < remaining; i++) {
    html += '<div class="cal-day padding"></div>';
  }

  html += '</div>';
  container.innerHTML = html;

  // Events
  document.getElementById('cal-prev').addEventListener('click', () => {
    state.calendarMonth--;
    if (state.calendarMonth < 1) { state.calendarMonth = 12; state.calendarYear--; }
    renderCalendar();
  });
  document.getElementById('cal-next').addEventListener('click', () => {
    state.calendarMonth++;
    if (state.calendarMonth > 12) { state.calendarMonth = 1; state.calendarYear++; }
    renderCalendar();
  });
  container.querySelectorAll('.cal-card').forEach(el => {
    el.addEventListener('click', () => {
      openCardModal(el.dataset.board, el.dataset.list, el.dataset.card);
    });
  });
}

/* ================================================================
   Table View
   ================================================================ */
async function renderTable() {
  const container = document.getElementById('table-content');
  let allCards = [];
  try {
    const boards = await api.get('/api/boards');
    for (const b of boards) {
      const bd = await api.get('/api/boards/' + b.slug);
      for (const listSlug of Object.keys(bd.lists || {})) {
        for (const c of (bd.lists[listSlug] || [])) {
          c._boardName = b.name;
          allCards.push(c);
        }
      }
    }
  } catch {
    container.innerHTML = '<div style="padding:20px;color:#e74c3c;">Failed to load cards.</div>';
    return;
  }

  allCards = applyFilters(allCards);

  // Sort
  allCards.sort((a, b) => {
    let va, vb;
    switch (state.sortColumn) {
      case 'title': va = (a.title || '').toLowerCase(); vb = (b.title || '').toLowerCase(); break;
      case 'board': va = (a._boardName || '').toLowerCase(); vb = (b._boardName || '').toLowerCase(); break;
      case 'list': va = (a.list || ''); vb = (b.list || ''); break;
      case 'assignee': va = (a.assignee || '').toLowerCase(); vb = (b.assignee || '').toLowerCase(); break;
      case 'due': va = a.due || '9999'; vb = b.due || '9999'; break;
      case 'labels':
        va = (Array.isArray(a.labels) ? a.labels.join(',') : '').toLowerCase();
        vb = (Array.isArray(b.labels) ? b.labels.join(',') : '').toLowerCase();
        break;
      default: va = ''; vb = '';
    }
    if (va < vb) return state.sortAsc ? -1 : 1;
    if (va > vb) return state.sortAsc ? 1 : -1;
    return 0;
  });

  function sortArrow(col) {
    if (state.sortColumn !== col) return '';
    return `<span class="sort-arrow">${state.sortAsc ? '▲' : '▼'}</span>`;
  }

  let html = `<table>
    <thead><tr>
      <th data-col="title">Title${sortArrow('title')}</th>
      <th data-col="board">Board${sortArrow('board')}</th>
      <th data-col="list">List${sortArrow('list')}</th>
      <th data-col="assignee">Assignee${sortArrow('assignee')}</th>
      <th data-col="due">Due Date${sortArrow('due')}</th>
      <th data-col="labels">Labels${sortArrow('labels')}</th>
    </tr></thead><tbody>`;

  for (const c of allCards) {
    const labels = Array.isArray(c.labels) ? c.labels : [];
    const labelsHtml = labels.map(l => `<span class="table-label ${labelColorClass(l)}">${escHtml(l)}</span>`).join('');
    const dueClass = c.due && isOverdue(c.due) && c.list !== 'done' ? 'overdue' : '';
    html += `<tr data-board="${escHtml(c.board)}" data-list="${escHtml(c.list)}" data-card="${escHtml(c.slug)}">
      <td>${escHtml(c.title)}</td>
      <td>${escHtml(c._boardName || c.board)}</td>
      <td>${formatListName(c.list)}</td>
      <td>${escHtml(c.assignee || '')}</td>
      <td class="table-due ${dueClass}">${formatDate(c.due)}</td>
      <td><div class="table-labels">${labelsHtml}</div></td>
    </tr>`;
  }

  html += '</tbody></table>';
  container.innerHTML = html;

  // Sort clicks
  container.querySelectorAll('th').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (state.sortColumn === col) {
        state.sortAsc = !state.sortAsc;
      } else {
        state.sortColumn = col;
        state.sortAsc = true;
      }
      renderTable();
    });
  });

  // Row clicks
  container.querySelectorAll('tbody tr').forEach(tr => {
    tr.addEventListener('click', () => {
      openCardModal(tr.dataset.board, tr.dataset.list, tr.dataset.card);
    });
  });
}

async function openCardModal(board, list, cardSlug) {
  let card;
  try {
    card = await api.get(`/api/cards/${board}/${list}/${cardSlug}`);
  } catch {
    alert('Failed to load card.');
    return;
  }
  state.modalCard = card;
  renderModal(card);
  document.getElementById('modal-overlay').classList.add('visible');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('visible');
  state.modalCard = null;
}

let savedTimeout = null;
function flashSaved() {
  const el = document.getElementById('modal-saved');
  el.classList.add('visible');
  clearTimeout(savedTimeout);
  savedTimeout = setTimeout(() => el.classList.remove('visible'), 1500);
}

function renderModal(card) {
  const body = document.getElementById('modal-body');
  const labels = Array.isArray(card.labels) ? card.labels : [];
  const description = parseDescription(card.body || '');
  const checklist = parseChecklistItems(card.body || '');
  const comments = parseComments(card.body || '');
  const attachments = Array.isArray(card.attachments) ? card.attachments : [];
  const relations = Array.isArray(card.relations) ? card.relations : [];

  let html = '';

  // Title
  html += `<textarea class="modal-title-input" id="modal-title" rows="1" spellcheck="false">${escHtml(card.title)}</textarea>`;
  html += `<button class="card-id-chip-modal" id="modal-id-chip" title="Click to copy [[${escHtml(card.id || card.slug)}]]">${escHtml(card.id || card.slug)}</button>`;
  html += `<div class="modal-path">${escHtml(card.board)} / ${formatListName(card.list)}</div>`;

  // Fields row (Assignee + Due Date as a 2-column grid)
  html += `<div class="modal-meta-grid">
    <div class="modal-field-row">
      <span class="modal-field-label">Assignee</span>
      <div class="modal-field-value"><input id="modal-assignee" value="${escHtml(card.assignee || '')}" placeholder="Unassigned" /></div>
    </div>
    <div class="modal-field-row">
      <span class="modal-field-label">Due date</span>
      <div class="modal-field-value"><input type="date" id="modal-due" lang="de-DE" value="${escHtml(card.due || '')}" /></div>
    </div>
  </div>`;

  // Labels
  html += `<div class="modal-section${labels.length ? '' : ' empty'}">
    <div class="modal-section-title">Labels</div>
    <div class="modal-labels" id="modal-labels">`;
  for (const l of labels) {
    html += `<span class="modal-label-tag ${labelColorClass(l)}">${escHtml(l)} <button class="remove-label" data-label="${escHtml(l)}">&times;</button></span>`;
  }
  html += `<input class="add-label-input" id="add-label-input" placeholder="Add label…" />`;
  html += `</div></div>`;

  // Description
  html += `<div class="modal-section${description ? '' : ' empty'}">
    <div class="modal-section-title">Description</div>
    <div id="desc-container">
      <div class="desc-display" id="desc-display">${linkifyHtml(description)}</div>
    </div>
  </div>`;

  // Checklist (with progress)
  const doneCount = checklist.filter(it => it.done).length;
  const totalCount = checklist.length;
  const pct = totalCount ? Math.round((doneCount / totalCount) * 100) : 0;
  html += `<div class="modal-section${totalCount ? '' : ' empty'}">
    <div class="modal-section-title">Checklist${totalCount ? `<span class="count">${doneCount} / ${totalCount}</span>` : ''}</div>`;
  if (totalCount) {
    html += `<div class="checklist-progress"><div class="checklist-progress-bar${pct === 100 ? ' complete' : ''}" style="width:${pct}%"></div></div>`;
  }
  html += `<div id="checklist-items">`;
  for (let i = 0; i < checklist.length; i++) {
    const item = checklist[i];
    html += `<div class="checklist-item${item.done ? ' done' : ''}">
      <input type="checkbox" data-index="${i}" ${item.done ? 'checked' : ''} />
      <label>${escHtml(item.text)}</label>
      <button class="remove-checklist-item" data-index="${i}" title="Remove">&times;</button>
    </div>`;
  }
  html += `</div>
    <div class="add-item-row">
      <input id="add-checklist-input" placeholder="Add an item…" />
      <button class="btn-add" id="add-checklist-btn">+ Add</button>
    </div>
  </div>`;

  // Links (stored as `attachments` for backwards compat)
  html += `<div class="modal-section${attachments.length ? '' : ' empty'}">
    <div class="modal-section-title">Links</div>
    <div id="attachments">`;
  for (let i = 0; i < attachments.length; i++) {
    const att = attachments[i];
    const name = typeof att === 'object' ? (att.name || att.url || 'Link') : att;
    const url = typeof att === 'object' ? (att.url || '#') : att;
    html += `<div class="attachment-row">
      <a href="${escHtml(url)}" target="_blank">${escHtml(name)}</a>
      <button class="remove-att" data-index="${i}">&times;</button>
    </div>`;
  }
  html += `</div>
    <button class="btn-add" id="add-att-btn">+ Add link</button>
  </div>`;

  // Related cards
  html += `<div class="modal-section${relations.length ? '' : ' empty'}">
    <div class="modal-section-title">Related cards</div>
    <div id="relations">`;
  for (let i = 0; i < relations.length; i++) {
    const rel = relations[i];
    const entry = state.idIndex.get(rel);
    const display = entry
      ? `<a href="#" class="card-link" data-id="${escHtml(rel)}">${escHtml(rel)}: ${escHtml(entry.title)}</a> <span class="relation-meta">${escHtml(entry.board)} / ${escHtml(formatListName(entry.list))}</span>`
      : `<span class="card-link missing">${escHtml(String(rel))} (not found)</span>`;
    html += `<div class="relation-row">
      ${display}
      <button class="remove-rel" data-index="${i}">&times;</button>
    </div>`;
  }
  html += `</div>
    <button class="btn-add" id="add-rel-btn">+ Add related card</button>
  </div>`;

  // Comments
  html += `<div class="modal-section${comments.length ? '' : ' empty'}">
    <div class="modal-section-title">Comments${comments.length ? `<span class="count">${comments.length}</span>` : ''}</div>
    <div id="comments-list">`;
  for (const c of comments) {
    html += `<div class="comment-item">
      <div class="comment-meta"><span class="comment-author">${escHtml(c.author)}</span><span class="comment-date">${escHtml(c.date)}</span></div>
      <div class="comment-text">${linkifyHtml(c.text)}</div>
    </div>`;
  }
  html += `</div>
    <div class="add-comment-form">
      <textarea id="comment-textarea" placeholder="Write a comment…"></textarea>
      <div class="post-row"><button class="btn-sm primary" id="post-comment-btn" disabled>Post</button></div>
    </div>
  </div>
  <div class="modal-footer">
    <button class="modal-delete" id="delete-card-btn" title="Delete this card">&#128465; Delete card</button>
  </div>`;

  body.innerHTML = html;

  // ── Wire up modal events ──────────────────────────────────────

  const cardPath = { board: card.board, list: card.list, slug: card.slug };

  // Title: auto-grow textarea, Enter saves (Shift+Enter for newline)
  const titleEl = document.getElementById('modal-title');
  const autosizeTitle = () => {
    titleEl.style.height = 'auto';
    titleEl.style.height = titleEl.scrollHeight + 'px';
  };
  // Defer initial sizing until after layout — scrollHeight is wrong if the
  // modal hasn't been laid out yet (returns single-line height).
  requestAnimationFrame(autosizeTitle);
  titleEl.addEventListener('input', autosizeTitle);
  titleEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      titleEl.blur();
    }
  });
  titleEl.addEventListener('blur', async (e) => {
    const newTitle = e.target.value.trim();
    if (newTitle && newTitle !== card.title) {
      await api.put(`/api/cards/${cardPath.board}/${cardPath.list}/${cardPath.slug}`, { title: newTitle });
      card.title = newTitle;
      refreshCurrentView();
    }
  });

  // ID chip copy to clipboard
  const idChip = document.getElementById('modal-id-chip');
  if (idChip) {
    idChip.addEventListener('click', () => {
      navigator.clipboard.writeText(`[[${card.id || card.slug}]]`);
      flashSaved();
    });
  }

  // Assignee save on blur
  document.getElementById('modal-assignee').addEventListener('blur', async (e) => {
    const val = e.target.value.trim();
    if (val !== (card.assignee || '')) {
      await api.put(`/api/cards/${cardPath.board}/${cardPath.list}/${cardPath.slug}`, { assignee: val });
      card.assignee = val;
      refreshCurrentView();
    }
  });

  // Due date save on change
  document.getElementById('modal-due').addEventListener('change', async (e) => {
    const val = e.target.value;
    await api.put(`/api/cards/${cardPath.board}/${cardPath.list}/${cardPath.slug}`, { due: val });
    card.due = val;
    refreshCurrentView();
  });

  // Remove label
  body.querySelectorAll('.remove-label').forEach(btn => {
    btn.addEventListener('click', async () => {
      const labelToRemove = btn.dataset.label;
      const newLabels = labels.filter(l => l !== labelToRemove);
      const updated = await api.put(`/api/cards/${cardPath.board}/${cardPath.list}/${cardPath.slug}`, { labels: newLabels });
      state.modalCard = updated;
      renderModal(updated);
      refreshCurrentView();
    });
  });

  // Add label
  document.getElementById('add-label-input').addEventListener('keydown', async (e) => {
    if (e.key === 'Enter') {
      const newLabel = e.target.value.trim();
      if (newLabel && !labels.includes(newLabel)) {
        const newLabels = [...labels, newLabel];
        const updated = await api.put(`/api/cards/${cardPath.board}/${cardPath.list}/${cardPath.slug}`, { labels: newLabels });
        state.modalCard = updated;
        renderModal(updated);
        refreshCurrentView();
      }
    }
  });

  // Description toggle edit (but let link clicks pass through to the browser)
  const descDisplay = document.getElementById('desc-display');
  descDisplay.addEventListener('click', (e) => {
    if (e.target.closest('a')) return;
    const container = document.getElementById('desc-container');
    container.innerHTML = `
      <div class="desc-edit">
        <textarea id="desc-textarea">${escHtml(description)}</textarea>
        <div class="desc-actions">
          <button class="btn-sm primary" id="desc-save">Save</button>
          <button class="btn-sm" id="desc-cancel">Cancel</button>
        </div>
      </div>`;
    const descTextarea = document.getElementById('desc-textarea');
    descTextarea.focus();
    attachWikilinkTypeahead(descTextarea);
    document.getElementById('desc-save').addEventListener('click', async () => {
      const newDesc = document.getElementById('desc-textarea').value;
      const updated = await api.put(`/api/cards/${cardPath.board}/${cardPath.list}/${cardPath.slug}`, { description: newDesc });
      state.modalCard = updated;
      renderModal(updated);
      refreshCurrentView();
    });
    document.getElementById('desc-cancel').addEventListener('click', () => {
      renderModal(card);
    });
  });

  // Checklist toggle
  body.querySelectorAll('#checklist-items input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', async () => {
      const idx = parseInt(cb.dataset.index, 10);
      checklist[idx].done = cb.checked;
      const clStr = buildChecklistString(checklist);
      const updated = await api.put(`/api/cards/${cardPath.board}/${cardPath.list}/${cardPath.slug}`, { checklist: clStr });
      state.modalCard = updated;
      renderModal(updated);
      updateCardChecklistBar(cardPath.board, cardPath.list, cardPath.slug, updated);
      refreshCurrentView();
    });
  });

  // Checklist remove
  body.querySelectorAll('.remove-checklist-item').forEach(btn => {
    btn.addEventListener('click', async () => {
      const idx = parseInt(btn.dataset.index, 10);
      checklist.splice(idx, 1);
      const clStr = buildChecklistString(checklist);
      const updated = await api.put(`/api/cards/${cardPath.board}/${cardPath.list}/${cardPath.slug}`, { checklist: clStr });
      state.modalCard = updated;
      renderModal(updated);
      updateCardChecklistBar(cardPath.board, cardPath.list, cardPath.slug, updated);
      refreshCurrentView();
    });
  });

  // Add checklist item
  const addCheckBtn = document.getElementById('add-checklist-btn');
  const addCheckInput = document.getElementById('add-checklist-input');
  const addChecklistItem = async () => {
    const text = addCheckInput.value.trim();
    if (!text) return;
    checklist.push({ done: false, text });
    const clStr = buildChecklistString(checklist);
    const updated = await api.put(`/api/cards/${cardPath.board}/${cardPath.list}/${cardPath.slug}`, { checklist: clStr });
    state.modalCard = updated;
    renderModal(updated);
    updateCardChecklistBar(cardPath.board, cardPath.list, cardPath.slug, updated);
    refreshCurrentView();
  };
  addCheckBtn.addEventListener('click', addChecklistItem);
  addCheckInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addChecklistItem(); });

  // Custom fields
  // Replace the trigger button with an inline form. On submit, calls onSubmit
  // with the field values keyed by name. On cancel, restores the original button.
  const showInlineForm = (triggerEl, fields, onSubmit) => {
    if (!triggerEl) return;
    const form = document.createElement('div');
    form.className = 'inline-form';
    form.innerHTML = fields.map((f, i) => `
      <div>
        <label>${escHtml(f.label)}</label>
        <input data-name="${escHtml(f.name)}" placeholder="${escHtml(f.placeholder || '')}" ${i === 0 ? 'autofocus' : ''} />
      </div>
    `).join('') + `
      <div class="actions">
        <button class="btn-sm" data-act="cancel">Cancel</button>
        <button class="btn-sm primary" data-act="save">Add</button>
      </div>`;
    triggerEl.replaceWith(form);
    const inputs = form.querySelectorAll('input');
    inputs[0]?.focus();

    const restore = () => form.replaceWith(triggerEl);
    const submit = async () => {
      const values = {};
      for (const inp of inputs) values[inp.dataset.name] = inp.value.trim();
      const required = fields.find(f => f.required !== false);
      if (required && !values[required.name]) { inputs[0]?.focus(); return; }
      await onSubmit(values);
    };
    form.querySelector('[data-act="cancel"]').addEventListener('click', restore);
    form.querySelector('[data-act="save"]').addEventListener('click', submit);
    inputs.forEach(inp => inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
      else if (e.key === 'Escape') { e.preventDefault(); restore(); }
    }));
  };

  const saveCard = async (patch) => {
    const updated = await api.put(`/api/cards/${cardPath.board}/${cardPath.list}/${cardPath.slug}`, patch);
    state.modalCard = updated;
    renderModal(updated);
    refreshCurrentView();
  };

  // Custom-fields support intentionally removed from the UI; legacy data on
  // disk is preserved by the server but no longer surfaced or editable here.

  // Links (stored as `attachments` for backwards compat)
  const addAttachment = (triggerEl) => {
    showInlineForm(triggerEl, [
      { name: 'name', label: 'Name', placeholder: 'Display text' },
      { name: 'url', label: 'URL', placeholder: 'https://…' },
    ], async ({ name, url }) => {
      if (!url) return;
      attachments.push({ name, url });
      await saveCard({ attachments });
    });
  };
  const attBtn = document.getElementById('add-att-btn');
  attBtn?.addEventListener('click', () => addAttachment(attBtn));
  body.querySelectorAll('.remove-att').forEach(btn => {
    btn.addEventListener('click', async () => {
      const idx = parseInt(btn.dataset.index, 10);
      attachments.splice(idx, 1);
      const updated = await api.put(`/api/cards/${cardPath.board}/${cardPath.list}/${cardPath.slug}`, { attachments });
      state.modalCard = updated;
      renderModal(updated);
      refreshCurrentView();
    });
  });

  // Relations — typeahead picker using state.idIndex
  const addRelation = (triggerEl) => {
    if (!triggerEl) return;
    const form = document.createElement('div');
    form.className = 'inline-form';
    form.innerHTML = `
      <div>
        <label>Search cards</label>
        <input data-name="q" placeholder="Type to search…" autofocus />
      </div>
      <div class="typeahead-results" data-results></div>
      <div class="actions">
        <button class="btn-sm" data-act="cancel">Cancel</button>
      </div>`;
    triggerEl.replaceWith(form);
    const input = form.querySelector('input');
    const results = form.querySelector('[data-results]');
    input.focus();

    const restore = () => form.replaceWith(triggerEl);
    form.querySelector('[data-act="cancel"]').addEventListener('click', restore);

    let active = -1;
    let current = [];

    const pick = async (entry) => {
      if (relations.includes(entry.id)) { restore(); return; }
      relations.push(entry.id);
      await saveCard({ relations });
    };

    const render = () => {
      if (!current.length) {
        results.innerHTML = input.value.trim()
          ? `<div class="typeahead-empty">No matches.</div>`
          : '';
        return;
      }
      results.innerHTML = current.map((entry, i) => `
        <div class="typeahead-result${i === active ? ' active' : ''}" data-i="${i}">
          <div class="ta-title">${escHtml(entry.id)}: ${escHtml(entry.title)}</div>
          <div class="ta-meta">${escHtml(entry.board)} / ${escHtml(formatListName(entry.list))}</div>
        </div>
      `).join('');
      results.querySelectorAll('.typeahead-result').forEach(el => {
        el.addEventListener('mousedown', (e) => {
          e.preventDefault();
          pick(current[parseInt(el.dataset.i, 10)]);
        });
      });
    };

    input.addEventListener('input', () => {
      const q = input.value.trim().toLowerCase();
      active = -1;
      if (!q) { current = []; render(); return; }
      // Filter idIndex entries by id-substring or title-substring
      current = [];
      for (const [id, entry] of state.idIndex) {
        if (current.length >= 10) break;
        if (id === card.id) continue;  // skip self
        if (relations.includes(id)) continue;  // skip already-related
        const text = `${id} ${entry.title}`.toLowerCase();
        if (text.includes(q)) {
          current.push({ id, ...entry });
        }
      }
      render();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { e.preventDefault(); restore(); }
      else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (current.length) { active = (active + 1) % current.length; render(); }
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (current.length) { active = (active - 1 + current.length) % current.length; render(); }
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (active >= 0 && current[active]) pick(current[active]);
        else if (current.length === 1) pick(current[0]);
      }
    });
  };
  const relBtn = document.getElementById('add-rel-btn');
  relBtn?.addEventListener('click', () => addRelation(relBtn));

  body.querySelectorAll('.remove-rel').forEach(btn => {
    btn.addEventListener('click', async () => {
      const idx = parseInt(btn.dataset.index, 10);
      relations.splice(idx, 1);
      const updated = await api.put(`/api/cards/${cardPath.board}/${cardPath.list}/${cardPath.slug}`, { relations });
      state.modalCard = updated;
      renderModal(updated);
      refreshCurrentView();
    });
  });
  body.querySelectorAll('.card-link[data-id]').forEach(a => {
    a.addEventListener('click', (e) => {
      if (a.classList.contains('missing')) return;
      e.preventDefault();
      const id = a.dataset.id;
      const entry = state.idIndex.get(id);
      if (entry) {
        openCardModal(entry.board, entry.list, id);
      }
    });
  });

  // Comments
  const commentTextarea = document.getElementById('comment-textarea');
  const postBtn = document.getElementById('post-comment-btn');
  attachWikilinkTypeahead(commentTextarea);
  commentTextarea.addEventListener('input', () => {
    postBtn.disabled = commentTextarea.value.trim().length === 0;
  });
  postBtn.addEventListener('click', async () => {
    const text = commentTextarea.value.trim();
    if (!text) return;
    const updated = await api.put(`/api/cards/${cardPath.board}/${cardPath.list}/${cardPath.slug}`, { comment: text });
    state.modalCard = updated;
    renderModal(updated);
    refreshCurrentView();
  });

  // Delete card
  document.getElementById('delete-card-btn').addEventListener('click', async () => {
    if (!confirm(`Delete "${card.title}"? This cannot be undone.`)) return;
    await api.del(`/api/cards/${cardPath.board}/${cardPath.list}/${cardPath.slug}`);
    closeModal();
    refreshCurrentView();
  });
}

let currentSyncMode = 'remote'; // updated by checkSyncStatus

document.getElementById('btn-sync').addEventListener('click', async () => {
  if (currentSyncMode === 'off') return; // disabled
  const btn = document.getElementById('btn-sync');
  const verb = currentSyncMode === 'local' ? 'Committing' : 'Syncing';
  const okLabel = currentSyncMode === 'local' ? '✓ Committed' : '✓ Synced';
  btn.classList.add('syncing');
  btn.textContent = '⟳ ' + verb + '...';
  try {
    const result = await api.post('/api/sync/push');
    btn.classList.remove('syncing');
    if (result.status === 'ok') {
      btn.classList.add('sync-ok');
      btn.textContent = okLabel;
    } else if (result.status === 'no-changes') {
      btn.classList.add('sync-ok');
      btn.textContent = '✓ Up to date';
    } else if (result.status === 'skipped') {
      btn.classList.add('sync-ok');
      btn.textContent = '○ ' + (result.message || 'skipped');
    } else {
      btn.classList.add('sync-err');
      btn.textContent = '✗ ' + (result.message || 'failed');
    }
  } catch (err) {
    btn.classList.remove('syncing');
    btn.classList.add('sync-err');
    btn.textContent = '✗ Sync failed';
  }
  setTimeout(() => {
    btn.classList.remove('sync-ok', 'sync-err');
    checkSyncStatus();
  }, 3000);
});

async function checkSyncStatus() {
  const btn = document.getElementById('btn-sync');
  if (
    btn.classList.contains('syncing') ||
    btn.classList.contains('sync-ok') ||
    btn.classList.contains('sync-err')
  ) return;
  try {
    const result = await api.get('/api/sync/status');
    currentSyncMode = result.mode || 'remote';
    btn.disabled = (currentSyncMode === 'off');
    btn.classList.toggle('sync-dirty', !!result.dirty);
    if (currentSyncMode === 'off') {
      btn.textContent = 'Sync off';
    } else if (currentSyncMode === 'local') {
      btn.textContent = result.dirty ? '↻ Commit needed' : '↻ Commit';
    } else {
      btn.textContent = result.dirty ? '↻ Sync needed' : '↻ Sync';
    }
  } catch { }
}
checkSyncStatus();
setInterval(checkSyncStatus, 10000);

   ================================================================ */
const cfgEls = {
  overlay: document.getElementById('settings-overlay'),
  token: document.getElementById('cfg-token'),
  baseUrl: document.getElementById('cfg-base-url'),
  model: document.getElementById('cfg-model'),
  tls: document.getElementById('cfg-tls-verify'),
  status: document.getElementById('cfg-status'),
  syncRemoteFields: document.getElementById('sync-remote-fields'),
  syncRemoteUrl: document.getElementById('sync-remote-url'),
  syncBranch: document.getElementById('sync-branch'),
  syncGitStatus: document.getElementById('sync-git-status'),
  syncStatusMsg: document.getElementById('sync-status-msg'),
  syncPullBtn: document.getElementById('btn-sync-pull'),
};

async function openSettings() {
  const [cfg, sync] = await Promise.all([
    api.get('/api/llm-config'),
    api.get('/api/sync/config'),
  ]);
  // LLM
  cfgEls.token.value = '';
  cfgEls.token.placeholder = cfg.auth_token || 'paste token';
  cfgEls.baseUrl.value = cfg.base_url || '';
  cfgEls.model.value = cfg.model || 'claude-opus-4-7';
  cfgEls.tls.checked = !!cfg.tls_verify;
  cfgEls.status.textContent = '';
  // Sync
  document
    .querySelector(`input[name="sync-mode"][value="${sync.mode}"]`)
    .checked = true;
  cfgEls.syncRemoteUrl.value = sync.remote_url || '';
  cfgEls.syncBranch.value = sync.branch || 'main';
  applySyncModeVisibility();
  cfgEls.syncGitStatus.textContent = `Status: ${describeGitStatus(sync.git_status, sync.mode)}`;

async function streamChat(messages, onEvent) {
  const r = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
    body: JSON.stringify({ messages }),
  });
  if (!r.ok) {
    let detail = '';
    try { const j = await r.json(); detail = j.error || ''; } catch {}
    throw new Error(detail || `POST /api/chat: ${r.status}`);
  }
  const reader = r.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  let last = null;
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n\n')) !== -1) {
      const block = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      const dataLines = block.split('\n')
        .filter(l => l.startsWith('data:'))
        .map(l => l.slice(5).trimStart());
      if (!dataLines.length) continue;
      let parsed;
      try { parsed = JSON.parse(dataLines.join('\n')); } catch { continue; }
      onEvent(parsed);
      if (parsed.type === 'done') last = parsed;
      if (parsed.type === 'error') throw new Error(parsed.message || 'chat error');
    }
  }
  return last;
}
